<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friends Only</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <div class="brand">
          <img src="icons/icon48.png" alt="" width="32" height="32" class="brand-icon" />
          <div>
            <h1 class="title">Friends Only</h1>
            <p id="status-text" class="subtitle">Loading status…</p>
          </div>
        </div>

        <label class="switch" aria-label="Toggle Friends Only">
          <input id="enabled-toggle" type="checkbox" role="switch" checked />
          <span class="slider"></span>
        </label>
      </header>

      <div id="permission-banner" class="permission-banner" hidden>
        <p class="permission-text">Site access to x.com is needed to filter your timeline.</p>
        <button id="grant-permission-btn" type="button" class="grant-btn">
          Allow on x.com
        </button>
      </div>

      <section class="card" aria-live="polite">
        <div class="stat-row">
          <span class="stat-label">Current tab</span>
          <span id="tab-summary" class="stat-value">Checking…</span>
        </div>
        <ul class="feature-list">
          <li>Keeps only posts from accounts you follow</li>
          <li>Hides Ads, Promoted &amp; Who to follow</li>
          <li>Hides suggested posts &amp; For you tab</li>
        </ul>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
